<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Everlife — 3D Life Simulator</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101722;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block}.hud{position:absolute;top:12px;left:12px;background:#142235d9;border:1px solid #ffffff25;border-radius:14px;padding:12px 14px;min-width:230px;backdrop-filter:blur(8px)}.hud h1{font-size:17px;margin:0 0 7px}.stat{font-size:13px;color:#d8e4f3;margin:4px 0}.bar{height:6px;background:#344458;border-radius:8px;overflow:hidden}.fill{height:100%;background:#71d9aa;width:0}.actions{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}.actions button,.pad button,.bottom button{background:#183047e8;border:1px solid #ffffff30;color:white;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}.actions button:active,.pad button:active,.bottom button:active{background:#2d5875}.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:94vw}.pad{position:absolute;bottom:100px;left:15px;display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px;gap:4px}.pad button{padding:0;font-size:20px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.msg{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);background:#142235e8;border-radius:12px;padding:10px 15px;max-width:90vw;text-align:center;font-size:14px;display:none}.hint{position:absolute;top:150px;left:12px;font-size:12px;color:#d6e0ed;background:#142235aa;padding:8px;border-radius:9px;max-width:220px}.close{position:absolute;top:10px;right:10px}
</style></head><body>
<div class="hud"><h1>🌆 Everlife</h1><div class="stat" id="clock">Day 1 · 08:00</div><div class="stat">💰 <span id="money">1200</span> coins</div><div class="stat">💗 <span id="rel">0</span> relationship</div><div class="stat">🏠 <span id="home">Single · Starter life</span></div><div class="stat">Mood</div><div class="bar"><div class="fill" id="mood"></div></div><div class="stat">Energy</div><div class="bar"><div class="fill" id="energy"></div></div></div>
<div class="actions"><button id="interact">Interact</button><button id="job">💼 Work</button><button id="sleep">🛏 Sleep</button><button id="reset">↻ Restart</button></div>
<div class="hint">Move with WASD / arrows or touch pad. Walk near a person or building and press Interact.</div>
<div class="pad"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button class="down" data-key="s">▼</button><button class="right" data-key="d">▶</button></div>
<div class="bottom"><button id="talk">💬 Talk</button><button id="date">🌹 Date</button><button id="kiss">💋 Kiss</button><button id="propose">💍 Propose</button><button id="baby">👶 Start family</button><button id="shop">🛒 Shop</button></div><div class="msg" id="msg"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc5df);scene.fog=new THREE.Fog(0x9dc5df,45,130);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,250);camera.position.set(0,12,18);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x60734b,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-20,30,20);sun.castShadow=true;scene.add(sun);
function mat(color){return new THREE.MeshStandardMaterial({color,roughness:.8})}const grass=mat(0x68a66a),road=mat(0x444951),side=mat(0xb7b8b5),white=mat(0xffffff),dark=mat(0x263544);
function box(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
let ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// city streets and sidewalks
box(0,.03,0,12,.08,140,road);box(0,.03,0,140,.08,12,road);box(7,.04,0,3,.1,140,side);box(-7,.04,0,3,.1,140,side);box(0,.04,7,140,.1,3,side);box(0,.04,-7,140,.1,3,side);
for(let i=-60;i<=60;i+=8){box(i,.09,0,.12,.02,4,mat(0xf1d47a));box(0,.09,i,4,.02,.12,mat(0xf1d47a));}
// buildings grouped around block, avoid central cross
const colors=[0xe8b7a5,0xc2d3df,0xd8c7a2,0x9fc2b0,0xc6b4d8,0xd7d9df];
const blocks=[[-22,-20],[-22,20],[22,-20],[22,20],[-40,0],[40,0],[0,-40],[0,40]];
blocks.forEach(([x,z],i)=>{const w=10+Math.random()*5,d=10+Math.random()*5,h=8+Math.random()*16;box(x,h/2,z,w,h,d,mat(colors[i%colors.length]));for(let yy=2;yy<h;yy+=3)for(let xx=-w/2+1;xx<w/2-1;xx+=3){const win=box(x+xx,yy,z+d/2+.04,1.2,1.3,.08,mat(0x7aa2bd));win.material.emissive=new THREE.Color(0x224466)}box(x,h+.25,z,w+.3,.5,d+.3,mat(0x37485b));});
// landmarks
function labelSprite(text){let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='#15283a';ctx.fillRect(0,0,512,128);ctx.fillStyle='white';ctx.font='bold 54px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,82);let tex=new THREE.CanvasTexture(c);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));s.scale.set(9,2.2,1);return s}
function landmark(name,x,z,color){box(x,1.3,z,9,2.6,8,mat(color));let sp=labelSprite(name);sp.position.set(x,4,z);scene.add(sp);}
landmark('CAFE',-15,12,0xc88b67);landmark('MARKET',15,12,0x86aa8a);landmark('PARK',0,22,0x6aaf73);landmark('HOME',-15,-12,0x7899ba);
// Character rig simple capsule + face + clothing
function person(color=0x6a89c2){const g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.2,4,8),mat(color));body.position.y=1.35;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),mat(0xf0c6a6));head.position.y=2.45;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.44,16,12),mat(0x49352b));hair.position.y=2.68;hair.scale.set(1,.65,1);g.add(hair);let legs=box(0,.45,0,.7,.65,.4,mat(0x33465e));legs.position.y=.45;g.add(legs);scene.add(g);return g;}
const player=person(0x4477bb);player.position.set(0,0,0);let npc=person(0xd26a8d);npc.position.set(4,0,3);let npc2=person(0x77aa88);npc2.position.set(-5,0,5);let child=null;
// trees
for(let i=0;i<45;i++){let x=(Math.random()*100-50),z=(Math.random()*100-50);if(Math.abs(x)<10||Math.abs(z)<10)continue;box(x,.8,z,.45,1.6,.45,mat(0x79563d));let crown=new THREE.Mesh(new THREE.SphereGeometry(1.8,12,8),mat(0x36834a));crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
let keys={},money=1200,relationship=0,married=false,day=1,hour=8,energy=100,mood=80,children=0;const el=id=>document.getElementById(id);function message(s){let m=el('msg');m.textContent=s;m.style.display='block';clearTimeout(window.mt);window.mt=setTimeout(()=>m.style.display='none',3500)}function update(){el('money').textContent=money;el('rel').textContent=relationship;el('home').textContent=married?'Married · Family life':'Single · Starter life';el('clock').textContent=`Day ${day} · ${String(hour).padStart(2,'0')}:00`;el('mood').style.width=mood+'%';el('energy').style.width=energy+'%';}
function nearby(){return player.position.distanceTo(npc.position)<4.5?npc:player.position.distanceTo(npc2.position)<4.5?npc2:null}function advance(){hour++;if(hour>=24){hour=0;day++}energy=Math.max(0,energy-4);update()}
function action(type){let n=nearby();if(type==='talk'){if(!n){message('Walk closer to someone first.');return}relationship=Math.min(100,relationship+8);mood=Math.min(100,mood+5);message('A friendly conversation. Relationship +8');advance();}
if(type==='date'){if(!n){message('Find someone nearby to invite.');return}if(money<60){message('Not enough money for a date.');return}money-=60;relationship=Math.min(100,relationship+18);mood=100;message('You enjoyed a date together. Relationship +18');advance();}
if(type==='kiss'){if(!n||relationship<35){message('Build a closer relationship first.');return}relationship=Math.min(100,relationship+7);message('A romantic kiss.');advance();}
if(type==='propose'){if(!n||relationship<75){message('You need a strong relationship (75+) and someone nearby.');return}if(married){message('You are already married.');return}married=true;relationship=100;message('💍 You are married!');advance();}
if(type==='baby'){if(!married){message('Marriage is required before starting a family in this prototype.');return}children++;if(child){child.position.x=player.position.x+2.2;child.position.z=player.position.z+2.2}else child=person(0xf0c78c);message('👶 A new child joins your family! Children: '+children);advance();}
if(type==='job'){money+=160;energy=Math.max(0,energy-25);message('You worked a shift and earned 160 coins.');advance();}
if(type==='sleep'){hour=8;day++;energy=100;mood=Math.min(100,mood+20);message('Rested. A new day begins.');update();}
if(type==='shop'){if(money>=100){money-=100;mood=Math.min(100,mood+15);message('You bought something nice. Mood +15');advance()}else message('Not enough coins.');}
if(type==='interact'){if(!n){message('Nothing close enough to interact with. Try a person or landmark.');return}message('Someone is nearby. Try Talk, Date, Kiss or Propose.');}}
['talk','date','kiss','propose','baby','job','sleep','shop','interact'].forEach(t=>el(t).addEventListener('click',()=>action(t)));
const keyMap={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'};window.addEventListener('keydown',e=>{keys[keyMap[e.key]||e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[keyMap[e.key]||e.key.toLowerCase()]=false});document.querySelectorAll('.pad button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});el('reset').onclick=()=>location.reload();
let last=0;function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000,.05);last=t;let v=new THREE.Vector3((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),0,(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0));if(v.length()>0){v.normalize();player.position.addScaledVector(v,dt*6);player.position.x=Math.max(-65,Math.min(65,player.position.x));player.position.z=Math.max(-65,Math.min(65,player.position.z));player.rotation.y=Math.atan2(v.x,v.z)}let target=new THREE.Vector3(player.position.x,8,player.position.z+13);camera.position.lerp(target,dt*4);camera.lookAt(player.position.x,1,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(loop);update();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
